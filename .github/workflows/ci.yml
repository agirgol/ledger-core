name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers needs a Docker daemon; ubuntu-latest ships one running.
      # The persistence tests run against real Postgres rather than H2, because
      # a ledger leans on numeric precision and isolation semantics that an
      # in-memory database with different rules would not exercise.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/**"
          retention-days: 7
          if-no-files-found: ignore
